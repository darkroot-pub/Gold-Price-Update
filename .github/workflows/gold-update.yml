name: Daily Gold & Silver Price Update

on:
  schedule:
    - cron: '30 4 * * *'   # 9:30 AM NPT

  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch gold price and update Firebase
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: python fetch_gold.py

      - name: Fetch silver price and update Firebase
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: python fetch_silver.py

      - name: Log completion
        run: echo "✅ Gold🪙 & Silver updated at $(date -u)"
